services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}?serverVersion=16&charset=utf8
      GAME_WEBSOCKET_PUBLIC_URL: ${GAME_WEBSOCKET_PUBLIC_URL}
      GAME_RUNTIME_ENABLED: ${GAME_RUNTIME_ENABLED:-0}
      GAME_RUNTIME_INTERNAL_URL: ${GAME_RUNTIME_INTERNAL_URL:-http://game-runtime:8091}
      GAME_RUNTIME_WEBSOCKET_PUBLIC_URL: ${GAME_RUNTIME_WEBSOCKET_PUBLIC_URL:-wss://api.commanderzone.com/ws}
      GAMEPLAY_COMPACT_RUNTIME_ENABLED: ${GAMEPLAY_COMPACT_RUNTIME_ENABLED:-0}
      GAMEPLAY_V2_ENABLED: ${GAMEPLAY_V2_ENABLED:-0}
      GAMEPLAY_V2_COMMAND_ENABLED: ${GAMEPLAY_V2_COMMAND_ENABLED:-0}
      GAMEPLAY_V2_COMMANDS_ALLOWLIST: ${GAMEPLAY_V2_COMMANDS_ALLOWLIST:-}
      GAMEPLAY_V2_PATCH_ENABLED: ${GAMEPLAY_V2_PATCH_ENABLED:-0}
      GAMEPLAY_V2_BOOTSTRAP_ENABLED: ${GAMEPLAY_V2_BOOTSTRAP_ENABLED:-0}
      GAMEPLAY_V2_EVENT_ENABLED: ${GAMEPLAY_V2_EVENT_ENABLED:-0}
      GAMEPLAY_V2_VISIBILITY_ENABLED: ${GAMEPLAY_V2_VISIBILITY_ENABLED:-0}
      SEMANTIC_PATCHES_ENABLED: ${SEMANTIC_PATCHES_ENABLED:-0}
      COMPACT_BOOTSTRAP_ENABLED: ${COMPACT_BOOTSTRAP_ENABLED:-0}
      SHADOW_COMPARE_ENABLED: ${SHADOW_COMPARE_ENABLED:-0}
      GAMEPLAY_STREAMS_ENABLED: ${GAMEPLAY_STREAMS_ENABLED:-1}
      GAMEPLAY_METRICS_OUTPUT: ${GAMEPLAY_METRICS_OUTPUT:-}
    depends_on:
      database:
        condition: service_healthy
      mercure:
        condition: service_started
      game-runtime:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./backend/docker/php/conf.d/api-prod-memory.ini:/usr/local/etc/php/conf.d/zz-api-prod-memory.ini:ro
      - ./backend/Caddyfile.prod:/etc/frankenphp/Caddyfile:ro
    mem_limit: 1200m
    cpus: "1.0"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - internal

  websocket:
    build:
      context: ./backend
    restart: unless-stopped
    command: php bin/console app:game-websocket-server
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}?serverVersion=16&charset=utf8
      GAME_WEBSOCKET_LISTEN: ${GAME_WEBSOCKET_LISTEN:-0.0.0.0:8081}
      GAME_WEBSOCKET_PUBLIC_URL: ${GAME_WEBSOCKET_PUBLIC_URL}
      GAME_WEBSOCKET_CONNECTION_LIMIT: ${GAME_WEBSOCKET_CONNECTION_LIMIT:-1000}
      GAME_WEBSOCKET_CONNECTION_LIMIT_PER_IP: ${GAME_WEBSOCKET_CONNECTION_LIMIT_PER_IP:-100}
      GAME_RUNTIME_ENABLED: ${GAME_RUNTIME_ENABLED:-0}
      GAME_RUNTIME_INTERNAL_URL: ${GAME_RUNTIME_INTERNAL_URL:-http://game-runtime:8091}
      GAME_RUNTIME_WEBSOCKET_PUBLIC_URL: ${GAME_RUNTIME_WEBSOCKET_PUBLIC_URL:-wss://api.commanderzone.com/ws}
      GAMEPLAY_COMPACT_RUNTIME_ENABLED: ${GAMEPLAY_COMPACT_RUNTIME_ENABLED:-0}
      GAMEPLAY_V2_ENABLED: ${GAMEPLAY_V2_ENABLED:-0}
      GAMEPLAY_V2_COMMAND_ENABLED: ${GAMEPLAY_V2_COMMAND_ENABLED:-0}
      GAMEPLAY_V2_COMMANDS_ALLOWLIST: ${GAMEPLAY_V2_COMMANDS_ALLOWLIST:-}
      GAMEPLAY_V2_PATCH_ENABLED: ${GAMEPLAY_V2_PATCH_ENABLED:-0}
      GAMEPLAY_V2_BOOTSTRAP_ENABLED: ${GAMEPLAY_V2_BOOTSTRAP_ENABLED:-0}
      GAMEPLAY_V2_EVENT_ENABLED: ${GAMEPLAY_V2_EVENT_ENABLED:-0}
      GAMEPLAY_V2_VISIBILITY_ENABLED: ${GAMEPLAY_V2_VISIBILITY_ENABLED:-0}
      SEMANTIC_PATCHES_ENABLED: ${SEMANTIC_PATCHES_ENABLED:-0}
      COMPACT_BOOTSTRAP_ENABLED: ${COMPACT_BOOTSTRAP_ENABLED:-0}
      SHADOW_COMPARE_ENABLED: ${SHADOW_COMPARE_ENABLED:-0}
      GAMEPLAY_STREAMS_ENABLED: ${GAMEPLAY_STREAMS_ENABLED:-1}
      GAMEPLAY_METRICS_OUTPUT: ${GAMEPLAY_METRICS_OUTPUT:-}
    depends_on:
      database:
        condition: service_healthy
      game-runtime:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./backend/docker/php/conf.d/websocket-prod-memory.ini:/usr/local/etc/php/conf.d/zz-websocket-prod-memory.ini:ro
    mem_limit: 900m
    cpus: "0.6"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "php", "bin/ws-healthcheck.php"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  game-runtime:
    build:
      context: ./game-runtime
      dockerfile: Dockerfile
      args:
        GO_BUILD_IMAGE: ${GAME_RUNTIME_GO_BUILD_IMAGE:-golang:1.22.12-bookworm}
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      GAME_RUNTIME_LISTEN: ${GAME_RUNTIME_LISTEN:-0.0.0.0:8091}
      GAME_RUNTIME_PERSISTENCE: ${GAME_RUNTIME_PERSISTENCE:-postgres}
      GAME_RUNTIME_OWNERSHIP_MODE: ${GAME_RUNTIME_OWNERSHIP_MODE:-single-node}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}?serverVersion=16&charset=utf8
      GAME_RUNTIME_TICKET_SECRET: ${GAME_RUNTIME_TICKET_SECRET}
      GAME_RUNTIME_COMMAND_TIMEOUT: ${GAME_RUNTIME_COMMAND_TIMEOUT:-15s}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GAME_RUNTIME_PORT:-8091}:8091"
    expose:
      - "8091"
    mem_limit: 512m
    cpus: "1.0"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "/usr/local/bin/game-runtime", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_NAME} -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    mem_limit: 2g
    cpus: "1.0"
    networks:
      - internal

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins https://commanderzone.com https://www.commanderzone.com https://app.commanderzone.com https://api.commanderzone.com
        anonymous
    command: /usr/bin/caddy run --config /etc/caddy/Caddyfile
    ports:
      - "3000:80"
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    mem_limit: 256m
    cpus: "0.3"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - internal

volumes:
  database_data:
  mercure_data:
  mercure_config:

networks:
  internal:
    driver: bridge
