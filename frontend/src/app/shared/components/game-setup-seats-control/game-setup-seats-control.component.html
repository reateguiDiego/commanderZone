<div class="setup-control seats-control">
  <div class="control-copy">
    <span class="eyebrow">{{ label() | runtimeTranslate }}</span>
    <strong>{{ value() }}</strong>
  </div>
  <app-tab-list
    class="players-tab-list"
    [items]="playerTabs()"
    [activeId]="value().toString()"
    ariaLabel="rooms.setup.gameSetupSeatsControl.tableSize"
    variant="pill"
    size="md"
    (tabSelected)="selectTab($event)"
  />
</div>
