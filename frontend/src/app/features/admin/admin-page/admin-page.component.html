<section class="admin-shell" [class.admin-shell--users]="activeSection() === 'users'" aria-labelledby="admin-title">
  <aside class="admin-aside" [attr.aria-label]="'admin.navigation.sectionsAriaLabel' | runtimeTranslate">
    <div class="admin-aside-heading">
      <span class="admin-icon" aria-hidden="true">
        <lucide-icon name="shield-check" size="22" />
      </span>
      <div>
        <h1 id="admin-title">{{ 'admin.title' | runtimeTranslate }}</h1>
      </div>
    </div>

    <nav class="admin-nav" [attr.aria-label]="'admin.navigation.toolsAriaLabel' | runtimeTranslate">
      @for (item of navigationItems; track item.id) {
        <button
          class="admin-nav-item"
          czButton="menu"
          type="button"
          [czButtonActive]="activeSection() === item.id"
          [attr.aria-current]="activeSection() === item.id ? 'page' : null"
          (click)="selectSection(item.id)"
        >
          <lucide-icon [name]="item.icon" size="17" />
          <span>{{ item.label | runtimeTranslate }}</span>
        </button>
      }
    </nav>
  </aside>

  <main
    class="admin-content"
    [class.admin-content--top]="contentPinnedToTop()"
    [class.admin-content--users]="activeSection() === 'users'"
  >
    @switch (activeSection()) {
      @case ('users') {
        <app-admin-users-panel class="admin-users-content" (sendMessageRequested)="openNotificationsForUser($event)" />
      }
      @case ('reports') {
        <app-admin-reports-panel (sendMessageRequested)="openNotificationsForUser($event)" />
      }
      @case ('notifications') {
        <app-admin-notifications-panel [preselectedRecipient]="preselectedNotificationRecipient()" />
      }
    }
  </main>
</section>
