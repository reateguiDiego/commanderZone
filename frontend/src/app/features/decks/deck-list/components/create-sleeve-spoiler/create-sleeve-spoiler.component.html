<section class="create-sleeve-spoiler" [attr.aria-label]="'deckBuilder.deckList.cosmetics.sleeveOptions' | runtimeTranslate">
  <app-tab-list
    class="create-sleeve-tier-tabs"
    [items]="tierTabItems"
    [activeId]="activeTier()"
    ariaLabel="deckBuilder.deckList.cosmetics.sleeveOptions"
    (tabSelected)="switchTierFromList($event)"
  />

  <div #sleeveGrid class="create-sleeve-spoiler-grid" appPrettyScroll>
    @for (sleeve of sleeves(); track sleeve.path) {
      <button
        class="create-sleeve-option"
        type="button"
        [class.is-selected]="sleeve.path === selectedSleevePath()"
        [attr.aria-label]="'deckBuilder.deckList.cosmetics.selectSleeve' | runtimeTranslate: { name: sleeve.label }"
        [attr.aria-pressed]="sleeve.path === selectedSleevePath()"
        (mouseenter)="showHoverPreview($event, sleeve)"
        (mousemove)="moveHoverPreview($event, sleeve)"
        (mouseleave)="hideHoverPreview()"
        (click)="selectSleeve(sleeve.path)"
      >
        <img
          class="create-sleeve-option-image"
          [src]="sleeve.path"
          [alt]="sleeve.label"
          width="78"
          height="110"
          loading="lazy"
          decoding="async"
        />
        @if (sleeve.premium) {
          <span class="create-sleeve-option-pill create-sleeve-option-pill--premium">{{ 'deckBuilder.deckList.cosmetics.premium' | runtimeTranslate }}</span>
        }
        @if (sleeve.combinationName) {
          <span class="create-sleeve-option-pill create-sleeve-option-pill--combination">
            {{ sleeve.combinationName }}
          </span>
        }
      </button>
    }
  </div>

  <footer class="create-sleeve-spoiler-actions">
    <button czButton="primary" type="button" [disabled]="!canSave()" (click)="saveSelection()">{{ 'common.actions.select' | runtimeTranslate }}</button>
  </footer>
</section>

@if (hoverPreview(); as preview) {
  <div
    class="create-sleeve-hover-preview"
    [style.left.px]="preview.left"
    [style.top.px]="preview.top"
    aria-hidden="true"
  >
    <img
      [src]="preview.sleeve.path"
      [alt]="preview.sleeve.label"
      width="360"
      height="502"
      decoding="async"
    />
  </div>
}
