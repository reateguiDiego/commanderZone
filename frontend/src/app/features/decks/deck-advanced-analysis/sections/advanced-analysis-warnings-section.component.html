<section class="advanced-analysis-section advanced-analysis-warnings" [attr.aria-label]="'deckBuilder.advancedAnalysis.warnings.title' | runtimeTranslate">
  @if (issues().length > 0) {
    <ol class="advanced-analysis-issue-list">
      @for (issue of issues(); track issue.code) {
        <li [attr.data-severity]="issue.severity">
          <div>
            <strong>{{ issue.title }}</strong>
            <span>{{ issue.severity }}</span>
          </div>
          <p>{{ issue.message }}</p>
        </li>
      }
    </ol>
  } @else {
    <p class="advanced-analysis-empty-copy">{{ 'deckBuilder.advancedAnalysis.warnings.empty' | runtimeTranslate }}</p>
  }
</section>
