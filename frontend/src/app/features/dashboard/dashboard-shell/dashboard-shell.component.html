<div class="app-frame" [class.room-focus]="roomFocus()" [class.has-impersonation-banner]="auth.isImpersonating()">
  @if (auth.impersonation(); as impersonation) {
    <div class="impersonation-banner" role="status">
      <span>{{ 'common.ui.impersonating' | runtimeTranslate: { name: impersonation.targetDisplayName } }}</span>
      <button type="button" czButton="secondary" czButtonSize="sm" (click)="stopImpersonation()">
        {{ 'common.ui.stop' | runtimeTranslate }}
      </button>
    </div>
  }

  @if (!roomFocus()) {
    <app-dashboard-header
      [userLabel]="userLabel()"
      [userAvatar]="auth.user()?.avatar"
      [userNameStyle]="auth.user()?.displayNameStyle"
      [friendsOpen]="friendsOpen()"
      [messagesOpen]="messagesOpen()"
      [pendingNotificationsCount]="friends.pendingNotificationsCount()"
      [onlineFriendsCount]="friends.onlineFriendsCount()"
      [messagesCount]="messages.totalCount()"
      [unreadMessagesCount]="messages.unreadCount()"
      [canAccessAdmin]="canAccessAdmin()"
      [authenticated]="auth.isAuthenticated()"
      (toggleFriends)="toggleFriends($event)"
      (toggleMessages)="toggleMessages($event)"
      (closeFriends)="closeFriends()"
      (closeMessages)="closeMessages()"
      (logout)="logout()"
      (friendRemovalRequested)="requestFriendRemoval($event)"
    />

    <app-dashboard-page-context [header]="pageHeader.state()" />
  }

  <main class="workspace">
    <router-outlet />
  </main>
</div>

<div class="friends-removal-confirmation">
  <app-modal
    [open]="pendingFriendRemoval() !== null"
    title="navigation.friends.friendsDropdown.removeFriend"
    message="common.modal.cannotBeUndone"
    primaryLabel="navigation.friends.friendsDropdown.removeFriend"
    secondaryLabel="shared.text.cancel"
    [danger]="true"
    [primaryDisabled]="removingFriend() || friends.loading()"
    (primary)="confirmFriendRemoval()"
    (secondary)="cancelFriendRemoval()"
  >
    @if (pendingFriendRemoval(); as friend) {
      <p class="notice">{{ friend.displayName }}</p>
    }
  </app-modal>
</div>
