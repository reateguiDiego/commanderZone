@let currentTurn = turn();

<div class="turn-phase-panel" data-testid="turn-panel" [class.is-current-turn-player]="isCurrentTurnPlayer()">
  <div class="turn-summary">
    <div class="turn-title">
      <app-players-order
        [players]="players()"
        [activePlayerId]="currentTurn.activePlayerId"
        [currentPlayerId]="currentPlayerId()"
        [turnNumber]="currentTurn.number"
      />
    </div>
    @if (!isCurrentTurnPlayer() && activeTurnPlayerName(); as activePlayerName) {
      <span class="active-turn-player-pill" data-testid="active-turn-player-pill">
        {{ 'game.turnPhasePanel.activeTurnPlayer' | runtimeTranslate: { name: activePlayerName } }}
      </span>
    }
    <div class="turn-actions">
      @if (isCurrentTurnPlayer()) {
        <button
          czButton="primary"
          czButtonSize="sm"
          type="button"
          class="turn-action-button pass-turn-button"
          data-testid="pass-turn"
          [title]="'shared.text.passTurn' | runtimeTranslate"
          (click)="passTurn.emit()"
        >
          <lucide-icon name="chevron-right" size="18" aria-hidden="true" />
          <span>{{ 'shared.text.passTurn' | runtimeTranslate }}</span>
        </button>
        <button
          czButton="primary"
          czButtonSize="sm"
          type="button"
          class="turn-action-button advance-phase-button"
          data-testid="advance-phase"
          [title]="'game.turnPhasePanel.advancePhase' | runtimeTranslate"
          (click)="advancePhase.emit()"
        >
          <lucide-icon name="play" size="17" aria-hidden="true" />
          <span data-testid="end-step">{{ nextPhaseKey() | runtimeTranslate }}</span>
        </button>
      }
      <app-compact-checkbox
        class="turn-focus-toggle"
        testId="follow-active-turn-player"
        [label]="'game.turnPhasePanel.focusTurn' | runtimeTranslate"
        [title]="'game.turnPhasePanel.focusTheActiveTurnPlayer' | runtimeTranslate"
        [tooltipStretch]="true"
        [checked]="followActiveTurnPlayer()"
        (checkedChange)="followActiveTurnPlayerChanged.emit($event)"
      />
    </div>
  </div>
  <div class="phase-tracker" [attr.aria-label]="'game.turnPhasePanel.turnPhases' | runtimeTranslate">
    <span class="sr-only" data-testid="active-phase">{{ currentTurn.phase }}</span>
    @for (phase of phases(); track phase) {
      <button
        type="button"
        data-testid="phase-step"
        [attr.data-phase]="phase"
        [class.active]="currentTurn.phase === phase"
        [class.phase-past]="isPhasePast()(phase)"
        [class.phase-compact]="isCompactPhase(phase)"
        [class.phase-combat]="phase === 'combat'"
        [attr.aria-current]="currentTurn.phase === phase ? 'step' : null"
      >
        <span class="phase-node">
          @if (phase === 'combat') {
            <lucide-icon class="phase-combat-sword" name="swords" size="21" aria-hidden="true" />
          }
        </span>
        <span class="phase-label">{{ phaseTranslationKey(phase) | runtimeTranslate }}</span>
      </button>
    }
  </div>
</div>
