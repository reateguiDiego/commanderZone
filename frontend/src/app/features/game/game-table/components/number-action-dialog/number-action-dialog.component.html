<section class="number-action-backdrop" data-testid="number-action-dialog">
  <form class="number-action-dialog" (click)="$event.stopPropagation()" (submit)="onSubmit($event)">
    <header>
      <h2>{{ title() | runtimeTranslate }}</h2>
      <p>{{ description() | runtimeTranslate }}</p>
    </header>

    <div class="number-selector" data-testid="number-action-selector">
      <input
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="2"
        data-testid="number-action-input"
        [attr.min]="min()"
        [attr.max]="max()"
        [value]="displayValue()"
        (input)="updateValueFromInput($event)"
        autofocus
      />
      <div class="number-stepper" [attr.aria-label]="'game.numberActionDialog.adjustValue' | runtimeTranslate">
        <button
          class="number-stepper-button"
          type="button"
          czButton="icon"
          czButtonSize="sm"
          data-testid="number-action-increase"
          [attr.aria-label]="'game.numberActionDialog.increaseValue' | runtimeTranslate"
          [disabled]="!canStepUp()"
          (click)="step(1)"
        >
          <lucide-icon name="chevron-up" [size]="15" [strokeWidth]="2.7" />
        </button>
        <button
          class="number-stepper-button"
          type="button"
          czButton="icon"
          czButtonSize="sm"
          data-testid="number-action-decrease"
          [attr.aria-label]="'game.numberActionDialog.decreaseValue' | runtimeTranslate"
          [disabled]="!canStepDown()"
          (click)="step(-1)"
        >
          <lucide-icon name="chevron-down" [size]="15" [strokeWidth]="2.7" />
        </button>
      </div>
    </div>

    @if (max(); as deckCardCount) {
      <p class="number-action-deck-count" data-testid="number-action-deck-count">
        {{ 'game.numberAction.deckCardCount' | runtimeTranslate: { count: deckCardCount } }}
      </p>
    }

    <footer>
      <button type="button" czButton="secondary" data-testid="number-action-cancel" (click)="cancelled.emit()">{{ cancelLabel() | runtimeTranslate }}</button>
      <button class="primary-action" type="submit" czButton="primary" data-testid="number-action-confirm">{{ confirmLabel() | runtimeTranslate }}</button>
    </footer>
  </form>
</section>
