@for (layer of stackLayers(); track layer.key) {
  <img
    class="zone-card-stack-layer"
    [style.--stack-offset.px]="layer.offset"
    [style.z-index]="layer.zIndex"
    [src]="layerImage() ?? ''"
    alt=""
    draggable="false"
    aria-hidden="true"
  />
}
<img
  #topCard
  class="zone-card-stack-top"
  [src]="image()"
  [alt]="label()"
  draggable="false"
/>
@if (showRevealIndicator()) {
  <span class="zone-card-stack-reveal-indicator library-top-revealed-indicator" aria-label="Revealed top library card">
    <svg class="lucide lucide-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
      <circle cx="12" cy="12" r="3" />
    </svg>
  </span>
}
