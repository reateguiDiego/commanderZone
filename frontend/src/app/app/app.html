<div class="app-route-frame" [class.app-route-frame-with-noindex-disclaimer]="showNoindexFooterDisclaimer()">
  <router-outlet />
</div>

@if (showFooterDisclaimer()) {
  <app-footer-disclaimer />
}

@if (showNoindexFooterDisclaimer()) {
  <app-noindex-footer-disclaimer />
}

<app-cookie-consent-banner />

@if (showGlobalLoading()) {
  <app-global-loader />
}

<app-modal
  [open]="contentSafety.prohibitedContentModalOpen()"
  title="contentSafety.modal.title"
  titleIcon="triangle-alert"
  ariaLabel="contentSafety.modal.title"
  [message]="contentSafety.prohibitedContentModalMessage()"
  primaryLabel="shared.text.close"
  [showSecondary]="false"
  [showCloseButton]="true"
  [danger]="true"
  closeLabel="shared.text.close"
  size="narrow"
  (primary)="contentSafety.dismissProhibitedContentModal()"
  (close)="contentSafety.dismissProhibitedContentModal()"
/>
