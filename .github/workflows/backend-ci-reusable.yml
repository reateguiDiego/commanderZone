name: Backend CI Reusable

on:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commanderzone
          POSTGRES_USER: commanderzone
          POSTGRES_PASSWORD: commanderzone
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -d commanderzone -U commanderzone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create test database
        run: APP_ENV=test php bin/console doctrine:database:create --if-not-exists --no-interaction

      - name: Run migrations (test)
        run: APP_ENV=test php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run gameplay realtime/runtime focused tests
        run: >-
          APP_ENV=test php bin/phpunit
          tests/UI/Http/GamesControllerV2Test.php
          tests/Application/GameEventStoreV2Test.php
          tests/Application/GameCommandHandlerV2Test.php
          tests/Application/GameplayRuntimeRouterTest.php
          tests/Application/GameRuntimeCommandClientTest.php
          tests/Application/GameRuntimeMulliganClientTest.php
          tests/Application/GameWebSocket

      - name: Run backend tests
        run: APP_ENV=test php bin/phpunit

      - name: Run gameplay performance smoke
        run: APP_ENV=test php bin/console app:gameplay:baseline --suite=smoke --iterations=1 --fail-on-regression --output=var/perf/gameplay-smoke.json --raw-output=var/perf/gameplay-smoke.ndjson

      - name: Setup Node for load gates
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate load supervision
        run: node --test ../scripts/load-test-gates.test.mjs

      - name: Navigation performance smoke
        run: |
          export APP_ENV=test
          export PHP_CLI_SERVER_WORKERS=5
          export USER_PASSWORD="$(openssl rand -hex 24)"
          php bin/seed-navigation-smoke.php
          php -S 127.0.0.1:8000 -t public bin/navigation-smoke-router.php > var/navigation-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8000/me; then break; fi
            sleep 1
          done
          bash ../scripts/run-navigation-load-smoke.sh

      - name: Upload navigation measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-performance
          path: reports/navigation-smoke/
